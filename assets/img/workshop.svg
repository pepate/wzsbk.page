<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Werkstatt – Team WZ">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#D9CFB4"/>
    </linearGradient>
    <linearGradient id="wfloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4733"/>
      <stop offset="1" stop-color="#0F2A1D"/>
    </linearGradient>
    <linearGradient id="wwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A7355"/>
      <stop offset="1" stop-color="#5A4A36"/>
    </linearGradient>
    <filter id="wgrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.07 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>

  <rect width="640" height="800" fill="url(#wbg)"/>

  <!-- High shelf with equipment cases -->
  <g>
    <rect x="40" y="120" width="560" height="6" fill="#5A4A36"/>
    <!-- boxes -->
    <rect x="60" y="80" width="80" height="40" fill="#1A1006"/>
    <rect x="150" y="70" width="70" height="50" fill="#C58A2C"/>
    <rect x="230" y="85" width="100" height="35" fill="#1F4733"/>
    <rect x="340" y="75" width="60" height="45" fill="#1A1006"/>
    <rect x="410" y="80" width="90" height="40" fill="#1F4733"/>
    <rect x="510" y="85" width="80" height="35" fill="#C58A2C"/>
    <!-- handles -->
    <rect x="80" y="92" width="40" height="3" fill="#C58A2C" opacity="0.7"/>
    <rect x="170" y="84" width="30" height="3" fill="#1F4733" opacity="0.5"/>
    <rect x="260" y="98" width="40" height="3" fill="#C58A2C" opacity="0.7"/>
    <rect x="350" y="88" width="40" height="3" fill="#C58A2C" opacity="0.7"/>
    <rect x="440" y="92" width="30" height="3" fill="#C58A2C" opacity="0.5"/>
    <rect x="540" y="98" width="20" height="3" fill="#1F4733" opacity="0.7"/>
  </g>

  <!-- Workbench -->
  <rect x="40" y="500" width="560" height="14" fill="url(#wwood)"/>
  <rect x="40" y="514" width="560" height="3" fill="#3F2E1E"/>
  <rect x="80" y="517" width="6" height="160" fill="#3F2E1E"/>
  <rect x="554" y="517" width="6" height="160" fill="#3F2E1E"/>

  <!-- Tools on bench -->
  <!-- wrench -->
  <g transform="translate(110 472) rotate(-8)">
    <rect width="120" height="10" rx="2" fill="#9CA39A"/>
    <circle cx="0" cy="5" r="10" fill="#9CA39A"/>
    <circle cx="0" cy="5" r="5" fill="#F5F1E8"/>
  </g>
  <!-- inspection light -->
  <g transform="translate(280 460)">
    <rect width="12" height="36" rx="2" fill="#1A1006"/>
    <ellipse cx="6" cy="42" rx="14" ry="6" fill="#C58A2C"/>
    <ellipse cx="6" cy="42" rx="9" ry="3" fill="#FBF3D9"/>
  </g>
  <!-- notebook -->
  <g transform="translate(330 478)">
    <rect width="100" height="22" fill="#0F2A1D"/>
    <rect width="100" height="3" fill="#C58A2C"/>
    <line x1="6" y1="10" x2="60" y2="10" stroke="#C3D9C0" stroke-width="0.8"/>
    <line x1="6" y1="14" x2="80" y2="14" stroke="#C3D9C0" stroke-width="0.8"/>
    <line x1="6" y1="18" x2="50" y2="18" stroke="#C3D9C0" stroke-width="0.8"/>
  </g>
  <!-- spray bottle -->
  <g transform="translate(460 446)">
    <rect x="6" y="20" width="34" height="38" rx="3" fill="#C58A2C"/>
    <rect x="14" y="6" width="18" height="14" fill="#1A1006"/>
    <rect x="32" y="8" width="20" height="3" fill="#1A1006"/>
  </g>

  <!-- Pegboard above bench -->
  <rect x="60" y="180" width="520" height="280" fill="#E5DCC2" opacity="0.6" stroke="#B7AB8E"/>
  <!-- pegboard dots -->
  <g fill="#B7AB8E" opacity="0.55">
    <circle cx="100" cy="220" r="1.6"/><circle cx="140" cy="220" r="1.6"/><circle cx="180" cy="220" r="1.6"/><circle cx="220" cy="220" r="1.6"/><circle cx="260" cy="220" r="1.6"/><circle cx="300" cy="220" r="1.6"/><circle cx="340" cy="220" r="1.6"/><circle cx="380" cy="220" r="1.6"/><circle cx="420" cy="220" r="1.6"/><circle cx="460" cy="220" r="1.6"/><circle cx="500" cy="220" r="1.6"/><circle cx="540" cy="220" r="1.6"/>
    <circle cx="100" cy="260" r="1.6"/><circle cx="140" cy="260" r="1.6"/><circle cx="180" cy="260" r="1.6"/><circle cx="220" cy="260" r="1.6"/><circle cx="260" cy="260" r="1.6"/><circle cx="300" cy="260" r="1.6"/><circle cx="340" cy="260" r="1.6"/><circle cx="380" cy="260" r="1.6"/><circle cx="420" cy="260" r="1.6"/><circle cx="460" cy="260" r="1.6"/><circle cx="500" cy="260" r="1.6"/><circle cx="540" cy="260" r="1.6"/>
    <circle cx="100" cy="300" r="1.6"/><circle cx="140" cy="300" r="1.6"/><circle cx="180" cy="300" r="1.6"/><circle cx="220" cy="300" r="1.6"/><circle cx="260" cy="300" r="1.6"/><circle cx="300" cy="300" r="1.6"/><circle cx="340" cy="300" r="1.6"/><circle cx="380" cy="300" r="1.6"/><circle cx="420" cy="300" r="1.6"/><circle cx="460" cy="300" r="1.6"/><circle cx="500" cy="300" r="1.6"/><circle cx="540" cy="300" r="1.6"/>
    <circle cx="100" cy="340" r="1.6"/><circle cx="140" cy="340" r="1.6"/><circle cx="180" cy="340" r="1.6"/><circle cx="220" cy="340" r="1.6"/><circle cx="260" cy="340" r="1.6"/><circle cx="300" cy="340" r="1.6"/><circle cx="340" cy="340" r="1.6"/><circle cx="380" cy="340" r="1.6"/><circle cx="420" cy="340" r="1.6"/><circle cx="460" cy="340" r="1.6"/><circle cx="500" cy="340" r="1.6"/><circle cx="540" cy="340" r="1.6"/>
    <circle cx="100" cy="380" r="1.6"/><circle cx="140" cy="380" r="1.6"/><circle cx="180" cy="380" r="1.6"/><circle cx="220" cy="380" r="1.6"/><circle cx="260" cy="380" r="1.6"/><circle cx="300" cy="380" r="1.6"/><circle cx="340" cy="380" r="1.6"/><circle cx="380" cy="380" r="1.6"/><circle cx="420" cy="380" r="1.6"/><circle cx="460" cy="380" r="1.6"/><circle cx="500" cy="380" r="1.6"/><circle cx="540" cy="380" r="1.6"/>
  </g>
  <!-- hung tools -->
  <g>
    <!-- screwdrivers -->
    <rect x="120" y="200" width="6" height="80" fill="#1F4733"/>
    <rect x="118" y="278" width="10" height="20" fill="#C58A2C"/>
    <rect x="140" y="200" width="6" height="100" fill="#1F4733"/>
    <rect x="138" y="298" width="10" height="20" fill="#9CA39A"/>
    <!-- pliers -->
    <g transform="translate(200 200)">
      <rect width="6" height="80" fill="#9CA39A"/>
      <rect x="14" width="6" height="80" fill="#9CA39A"/>
      <rect x="-2" y="-8" width="24" height="14" fill="#1F4733"/>
    </g>
    <!-- hammer -->
    <g transform="translate(290 200)">
      <rect width="6" height="100" fill="#7A6448"/>
      <rect x="-12" y="-4" width="30" height="20" fill="#1F4733"/>
    </g>
    <!-- inspection mirror -->
    <g transform="translate(380 200)">
      <rect width="4" height="100" fill="#9CA39A"/>
      <circle cx="2" cy="-8" r="14" fill="#C3D9C0" stroke="#1F4733"/>
    </g>
    <!-- coiled hose -->
    <g transform="translate(460 220)">
      <circle cx="0" cy="0" r="40" fill="none" stroke="#1A1006" stroke-width="6"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#1A1006" stroke-width="6"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#1A1006" stroke-width="6"/>
    </g>
  </g>

  <!-- Floor -->
  <rect x="0" y="677" width="640" height="123" fill="url(#wfloor)"/>
  <line x1="0" y1="677" x2="640" y2="677" stroke="#0A1F12" stroke-width="0.8"/>

  <!-- Floor reflection -->
  <rect x="60" y="677" width="520" height="60" fill="#FBF3D9" opacity="0.04"/>

  <!-- Frame line -->
  <rect x="0.5" y="0.5" width="639" height="799" fill="none" stroke="#0F2A1D" stroke-width="0.6" opacity="0.18"/>

  <!-- Grain -->
  <rect width="640" height="800" filter="url(#wgrain)" opacity="0.65"/>
</svg>
