<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Anna – Portrait">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#D9CFB4"/>
    </linearGradient>
    <linearGradient id="askin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C7A0"/>
      <stop offset="1" stop-color="#B8956C"/>
    </linearGradient>
    <linearGradient id="ajacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4733"/>
      <stop offset="1" stop-color="#0F2A1D"/>
    </linearGradient>
    <filter id="agrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="13"/><feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.07 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>

  <rect width="600" height="750" fill="url(#abg)"/>
  <radialGradient id="avig" cx="0.5" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#FBF3D9" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#D9CFB4" stop-opacity="0"/>
  </radialGradient>
  <rect width="600" height="750" fill="url(#avig)"/>

  <!-- shoulders -->
  <path d="M50 750 Q50 600 150 550 Q220 520 300 520 Q380 520 450 550 Q550 600 550 750 Z" fill="url(#ajacket)"/>

  <!-- scarf / neckline accent -->
  <path d="M220 540 Q300 560 380 540 L380 600 Q300 620 220 600 Z" fill="#C58A2C" opacity="0.85"/>

  <!-- neck -->
  <path d="M270 470 Q270 520 300 520 Q330 520 330 470 Z" fill="url(#askin)"/>
  <path d="M270 500 Q300 520 330 500 L330 520 L270 520 Z" fill="#000" opacity="0.15"/>

  <!-- head -->
  <ellipse cx="300" cy="380" rx="98" ry="118" fill="url(#askin)"/>
  <path d="M340 280 Q395 360 350 490 Q330 500 320 488 Q360 380 340 280 Z" fill="#000" opacity="0.1"/>

  <!-- hair (long, soft frame) -->
  <path d="M195 360 Q190 290 240 240 Q290 200 350 220 Q410 240 410 320 Q415 410 400 480 Q400 520 380 540 Q380 460 380 380 Q360 320 300 310 Q230 320 220 380 Q220 460 220 540 Q200 520 200 480 Q185 410 195 360 Z" fill="#5A4634"/>
  <!-- hair shine -->
  <path d="M240 280 Q260 250 290 240" stroke="#7A6448" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- ears (subtle) -->
  <ellipse cx="220" cy="395" rx="8" ry="14" fill="url(#askin)"/>
  <ellipse cx="380" cy="395" rx="8" ry="14" fill="url(#askin)"/>

  <!-- eyebrows -->
  <path d="M240 365 Q265 358 290 364" stroke="#3A2E1E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M310 364 Q335 358 360 365" stroke="#3A2E1E" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="262" cy="386" rx="7.5" ry="4.6" fill="#0F2A1D"/>
  <ellipse cx="338" cy="386" rx="7.5" ry="4.6" fill="#0F2A1D"/>
  <circle cx="264" cy="385" r="1.4" fill="#F5F1E8"/>
  <circle cx="340" cy="385" r="1.4" fill="#F5F1E8"/>

  <!-- nose -->
  <path d="M298 396 Q294 426 292 444 Q300 450 308 444 Q306 426 302 396 Z" fill="#000" opacity="0.08"/>

  <!-- mouth (warm smile) -->
  <path d="M275 458 Q300 472 325 458" stroke="#A0533A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M278 460 Q300 470 322 460 Q300 466 278 460 Z" fill="#A0533A" opacity="0.4"/>

  <!-- earring -->
  <circle cx="220" cy="412" r="3" fill="#C58A2C"/>
  <circle cx="380" cy="412" r="3" fill="#C58A2C"/>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="599" height="749" fill="none" stroke="#0F2A1D" stroke-width="0.6" opacity="0.18"/>
  <rect width="600" height="750" filter="url(#agrain)" opacity="0.55"/>
</svg>
