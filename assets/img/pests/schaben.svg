<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Schabe – Blattodea, dezent illustriert">
  <defs>
    <linearGradient id="sbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4733"/>
      <stop offset="1" stop-color="#0F2A1D"/>
    </linearGradient>
    <radialGradient id="slight" cx="0.55" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#FBF3D9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0F2A1D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sshell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6A1A"/>
      <stop offset="0.5" stop-color="#7A4A12"/>
      <stop offset="1" stop-color="#3A2008"/>
    </linearGradient>
    <linearGradient id="sshellHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C58A2C" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#C58A2C" stop-opacity="0"/>
    </linearGradient>
    <filter id="sgrain"><feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="37"/><feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0.06 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>

  <!-- Dark night-time mood: kitchen at night with flashlight beam -->
  <rect width="640" height="800" fill="url(#sbg2)"/>
  <rect width="640" height="800" fill="url(#slight)"/>

  <!-- Faint tile lines on floor -->
  <g opacity="0.18">
    <line x1="0" y1="660" x2="640" y2="660" stroke="#3F5E48" stroke-width="0.6"/>
    <line x1="0" y1="720" x2="640" y2="720" stroke="#3F5E48" stroke-width="0.6"/>
    <line x1="0" y1="780" x2="640" y2="780" stroke="#3F5E48" stroke-width="0.6"/>
    <line x1="160" y1="600" x2="160" y2="800" stroke="#3F5E48" stroke-width="0.4"/>
    <line x1="320" y1="600" x2="320" y2="800" stroke="#3F5E48" stroke-width="0.4"/>
    <line x1="480" y1="600" x2="480" y2="800" stroke="#3F5E48" stroke-width="0.4"/>
  </g>

  <!-- Latin label -->
  <text x="48" y="180" fill="#F5F1E8" opacity="0.07" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="120">Blattodea</text>

  <!-- Soft shadow under cockroach -->
  <ellipse cx="340" cy="560" rx="140" ry="6" fill="#000" opacity="0.4"/>

  <!-- Cockroach — top-down view (more recognizable) -->
  <g transform="translate(320 460)">
    <!-- Outer body silhouette -->
    <ellipse cx="0" cy="0" rx="120" ry="74" fill="url(#sshell)"/>
    <!-- Highlight band -->
    <ellipse cx="0" cy="-30" rx="100" ry="34" fill="url(#sshellHi)"/>

    <!-- Pronotum (shield over head) -->
    <path d="M-90 -34 Q-94 -56 -50 -64 Q0 -70 50 -64 Q94 -56 90 -34 Q60 -28 0 -28 Q-60 -28 -90 -34 Z" fill="#1F100A"/>
    <!-- pronotum highlight -->
    <ellipse cx="0" cy="-50" rx="50" ry="6" fill="#C58A2C" opacity="0.45"/>

    <!-- Wing centre line -->
    <line x1="0" y1="-28" x2="0" y2="68" stroke="#1F100A" stroke-width="1.4" opacity="0.85"/>

    <!-- Wing veins (subtle) -->
    <g stroke="#1F100A" stroke-width="0.6" fill="none" opacity="0.5">
      <path d="M-10 -20 Q-30 0 -40 50"/>
      <path d="M-20 -16 Q-50 0 -70 40"/>
      <path d="M-30 -10 Q-70 0 -90 30"/>
      <path d="M10 -20 Q30 0 40 50"/>
      <path d="M20 -16 Q50 0 70 40"/>
      <path d="M30 -10 Q70 0 90 30"/>
    </g>

    <!-- Head (small, partly hidden under pronotum) -->
    <ellipse cx="0" cy="-72" rx="22" ry="14" fill="#1A1006"/>
    <!-- Compound eyes -->
    <ellipse cx="-12" cy="-78" rx="4" ry="5" fill="#3A2008"/>
    <ellipse cx="12" cy="-78" rx="4" ry="5" fill="#3A2008"/>

    <!-- Long whip antennae (signature feature) -->
    <path d="M-14 -84 Q-60 -110 -110 -116 Q-160 -118 -200 -100" stroke="#1A1006" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M14 -84 Q60 -110 110 -116 Q160 -118 200 -100" stroke="#1A1006" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- Antennae sub-segments hint -->
    <g stroke="#3A2008" stroke-width="0.8">
      <line x1="-40" y1="-100" x2="-44" y2="-104"/>
      <line x1="-80" y1="-114" x2="-84" y2="-118"/>
      <line x1="-130" y1="-118" x2="-134" y2="-122"/>
      <line x1="40" y1="-100" x2="44" y2="-104"/>
      <line x1="80" y1="-114" x2="84" y2="-118"/>
      <line x1="130" y1="-118" x2="134" y2="-122"/>
    </g>

    <!-- 6 spiny legs splayed out -->
    <g stroke="#1A1006" stroke-width="2.6" fill="none" stroke-linecap="round">
      <!-- left side -->
      <path d="M-90 -10 Q-130 -20 -160 -10 L-160 -22"/>
      <path d="M-100 20 Q-140 30 -170 30 L-176 22"/>
      <path d="M-90 50 Q-130 70 -150 80 L-156 72"/>
      <!-- right side -->
      <path d="M90 -10 Q130 -20 160 -10 L160 -22"/>
      <path d="M100 20 Q140 30 170 30 L176 22"/>
      <path d="M90 50 Q130 70 150 80 L156 72"/>
    </g>
    <!-- Tibial spines -->
    <g stroke="#3A2008" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7">
      <line x1="-130" y1="-20" x2="-134" y2="-26"/>
      <line x1="-140" y1="30" x2="-144" y2="36"/>
      <line x1="-130" y1="70" x2="-134" y2="76"/>
      <line x1="130" y1="-20" x2="134" y2="-26"/>
      <line x1="140" y1="30" x2="144" y2="36"/>
      <line x1="130" y1="70" x2="134" y2="76"/>
    </g>

    <!-- Cerci (rear sensory appendages) -->
    <line x1="-12" y1="70" x2="-22" y2="86" stroke="#1A1006" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="70" x2="22" y2="86" stroke="#1A1006" stroke-width="2" stroke-linecap="round"/>

    <!-- Tiny fleck highlight on wing -->
    <ellipse cx="-30" cy="-12" rx="14" ry="6" fill="#FBF3D9" opacity="0.12"/>
  </g>

  <!-- Editorial monogram -->
  <g transform="translate(560 56)">
    <circle r="22" fill="none" stroke="#F5F1E8" stroke-width="0.8" opacity="0.4"/>
    <text text-anchor="middle" dominant-baseline="central" font-family="Newsreader, serif" font-style="italic" font-size="20" fill="#C58A2C">05</text>
  </g>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="639" height="799" fill="none" stroke="#F5F1E8" stroke-width="0.6" opacity="0.12"/>
  <rect width="640" height="800" filter="url(#sgrain)" opacity="0.55"/>
</svg>
