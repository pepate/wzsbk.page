<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wespe – Vespula vulgaris, dezent illustriert">
  <defs>
    <linearGradient id="wbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#E5DCC2"/>
    </linearGradient>
    <linearGradient id="wbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C58A2C"/>
      <stop offset="1" stop-color="#9A6A1A"/>
    </linearGradient>
    <radialGradient id="wwing" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#F5F1E8" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#F5F1E8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F5F1E8" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="wgrain2"><feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="31"/><feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0.05 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>

  <rect width="640" height="800" fill="url(#wbg2)"/>

  <!-- Hint of a paper-wasp nest in upper corner -->
  <g opacity="0.35" transform="translate(60 60)">
    <ellipse cx="60" cy="50" rx="55" ry="45" fill="#9A8A6B"/>
    <ellipse cx="60" cy="50" rx="55" ry="45" fill="none" stroke="#7A6448" stroke-width="0.6"/>
    <!-- Hexagonal cells -->
    <g fill="#7A6448" opacity="0.5">
      <polygon points="40,72 48,68 56,72 56,80 48,84 40,80"/>
      <polygon points="56,72 64,68 72,72 72,80 64,84 56,80"/>
      <polygon points="72,72 80,68 88,72 88,80 80,84 72,80"/>
      <polygon points="48,84 56,80 64,84 64,92 56,96 48,92"/>
      <polygon points="64,84 72,80 80,84 80,92 72,96 64,92"/>
    </g>
    <!-- Suspension thread -->
    <line x1="60" y1="0" x2="60" y2="10" stroke="#7A6448" stroke-width="0.8"/>
  </g>

  <!-- Latin label -->
  <text x="200" y="200" fill="#0F2A1D" opacity="0.07" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="100">Vespula</text>
  <text x="220" y="260" fill="#0F2A1D" opacity="0.07" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="60">vulgaris</text>

  <!-- Motion blur trail behind wasp -->
  <g opacity="0.18">
    <path d="M120 360 Q200 380 280 400" stroke="#C58A2C" stroke-width="1.5" fill="none" stroke-dasharray="2 4"/>
  </g>

  <!-- Hero wasp — flight pose, three quarter view -->
  <g transform="translate(360 460) rotate(-12) scale(2.2)">
    <!-- Shadow blur underneath -->
    <ellipse cx="0" cy="100" rx="60" ry="6" fill="#000" opacity="0.15"/>

    <!-- Wings — translucent, slightly lifted -->
    <g opacity="0.85">
      <ellipse cx="-10" cy="-30" rx="44" ry="18" fill="url(#wwing)" stroke="#0F2A1D" stroke-width="0.5" transform="rotate(-25 -10 -30)"/>
      <ellipse cx="10" cy="-26" rx="38" ry="16" fill="url(#wwing)" stroke="#0F2A1D" stroke-width="0.5" transform="rotate(-15 10 -26)"/>
      <!-- Wing veins -->
      <path d="M-44 -34 Q-20 -28 4 -38" stroke="#0F2A1D" stroke-width="0.4" fill="none" opacity="0.6"/>
      <path d="M-44 -28 Q-20 -22 4 -28" stroke="#0F2A1D" stroke-width="0.4" fill="none" opacity="0.5"/>
      <path d="M-32 -42 Q-12 -38 8 -44" stroke="#0F2A1D" stroke-width="0.4" fill="none" opacity="0.5"/>
    </g>

    <!-- Thorax (top, dark) -->
    <ellipse cx="-8" cy="0" rx="22" ry="18" fill="#1A1006"/>
    <!-- thorax fuzz -->
    <ellipse cx="-12" cy="-6" rx="12" ry="6" fill="#5A4634" opacity="0.6"/>

    <!-- Petiole -->
    <path d="M14 0 L22 -2 L22 2 Z" fill="#1A1006"/>

    <!-- Abdomen — striped yellow/black -->
    <g>
      <ellipse cx="48" cy="6" rx="32" ry="22" fill="url(#wbody)"/>
      <!-- stripes -->
      <path d="M28 -8 Q34 -18 36 -16 Q38 -8 32 4 Q24 -2 28 -8 Z" fill="#1A1006"/>
      <path d="M44 -14 Q52 -22 56 -20 Q60 -10 50 8 Q40 -4 44 -14 Z" fill="#1A1006"/>
      <path d="M60 -10 Q70 -18 74 -10 Q72 4 64 14 Q56 4 60 -10 Z" fill="#1A1006"/>
      <!-- highlight -->
      <ellipse cx="44" cy="0" rx="20" ry="6" fill="#E8B14B" opacity="0.5"/>
      <!-- Stinger tip -->
      <path d="M76 8 L88 14 L82 16 Z" fill="#1A1006"/>
    </g>

    <!-- Head -->
    <circle cx="-32" cy="-2" r="14" fill="url(#wbody)"/>
    <!-- compound eye (large, kidney-shaped) -->
    <ellipse cx="-38" cy="-6" rx="6" ry="9" fill="#1A1006"/>
    <ellipse cx="-39" cy="-7" rx="3" ry="4" fill="#C58A2C" opacity="0.6"/>
    <!-- mandibles -->
    <path d="M-44 4 L-52 6 L-46 8 Z" fill="#1A1006"/>
    <!-- antennae -->
    <path d="M-38 -14 Q-46 -24 -42 -32" stroke="#1A1006" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M-32 -16 Q-38 -28 -32 -36" stroke="#1A1006" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- Legs -->
    <path d="M-12 12 Q-20 24 -28 30" stroke="#1A1006" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M-2 14 Q-2 28 -8 38" stroke="#1A1006" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M8 14 Q14 28 16 36" stroke="#1A1006" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Editorial monogram -->
  <g transform="translate(560 56)">
    <circle r="22" fill="none" stroke="#0F2A1D" stroke-width="0.8" opacity="0.5"/>
    <text text-anchor="middle" dominant-baseline="central" font-family="Newsreader, serif" font-style="italic" font-size="20" fill="#C58A2C">04</text>
  </g>

  <!-- Frame -->
  <rect x="0.5" y="0.5" width="639" height="799" fill="none" stroke="#0F2A1D" stroke-width="0.6" opacity="0.18"/>
  <rect width="640" height="800" filter="url(#wgrain2)" opacity="0.5"/>
</svg>
