<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Markus – Portrait">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F5E48"/>
      <stop offset="1" stop-color="#1F4733"/>
    </linearGradient>
    <linearGradient id="mskin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B68B"/>
      <stop offset="1" stop-color="#A88560"/>
    </linearGradient>
    <linearGradient id="mjacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1006"/>
      <stop offset="1" stop-color="#0F2A1D"/>
    </linearGradient>
    <filter id="mgrain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="17"/><feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0.07 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>

  <rect width="600" height="750" fill="url(#mbg)"/>
  <radialGradient id="mvig" cx="0.4" cy="0.42" r="0.65">
    <stop offset="0" stop-color="#5A7A60" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#1F4733" stop-opacity="0"/>
  </radialGradient>
  <rect width="600" height="750" fill="url(#mvig)"/>

  <!-- shoulders -->
  <path d="M40 750 Q40 600 130 540 Q210 510 300 510 Q390 510 470 540 Q560 600 560 750 Z" fill="url(#mjacket)"/>

  <!-- shirt collar -->
  <path d="M250 540 L300 605 L350 540 Z" fill="#C3D9C0"/>
  <path d="M260 540 L300 580 L340 540 Z" fill="#0F2A1D"/>

  <!-- neck -->
  <path d="M268 460 Q268 510 300 510 Q332 510 332 460 Z" fill="url(#mskin)"/>
  <path d="M268 488 Q300 510 332 488 L332 510 L268 510 Z" fill="#000" opacity="0.18"/>

  <!-- head (slightly square jaw) -->
  <path d="M205 350 Q205 260 280 240 Q360 240 395 290 Q400 360 395 410 Q395 470 360 490 Q300 506 240 490 Q205 470 205 410 Z" fill="url(#mskin)"/>

  <!-- side shadow -->
  <path d="M340 260 Q400 360 360 490 Q335 500 320 488 Q360 380 340 260 Z" fill="#000" opacity="0.13"/>

  <!-- short cropped hair / receding -->
  <path d="M210 320 Q220 270 280 248 Q360 245 390 290 Q395 320 388 340 Q360 300 320 295 Q260 295 220 330 Q210 330 210 320 Z" fill="#1A1006"/>
  <!-- temple gray -->
  <path d="M210 340 Q220 320 240 320 Q235 340 220 360 Q212 358 210 340 Z" fill="#9CA39A" opacity="0.5"/>

  <!-- ears -->
  <ellipse cx="206" cy="390" rx="11" ry="20" fill="url(#mskin)"/>
  <ellipse cx="394" cy="390" rx="11" ry="20" fill="url(#mskin)"/>

  <!-- glasses -->
  <g stroke="#1A1006" stroke-width="3" fill="none">
    <rect x="225" y="365" width="60" height="32" rx="6"/>
    <rect x="315" y="365" width="60" height="32" rx="6"/>
    <line x1="285" y1="380" x2="315" y2="380"/>
    <line x1="225" y1="378" x2="208" y2="372"/>
    <line x1="375" y1="378" x2="392" y2="372"/>
  </g>
  <!-- subtle lens reflections -->
  <rect x="232" y="368" width="40" height="6" fill="#F5F1E8" opacity="0.18"/>
  <rect x="322" y="368" width="40" height="6" fill="#F5F1E8" opacity="0.18"/>

  <!-- eyebrows (above frames) -->
  <path d="M232 358 Q255 350 280 358" stroke="#1A1006" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M320 358 Q345 350 368 358" stroke="#1A1006" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eyes inside frames -->
  <ellipse cx="255" cy="382" rx="6" ry="3.5" fill="#0F2A1D"/>
  <ellipse cx="345" cy="382" rx="6" ry="3.5" fill="#0F2A1D"/>

  <!-- nose -->
  <path d="M298 400 Q294 430 292 450 Q300 456 308 450 Q306 430 302 400 Z" fill="#000" opacity="0.12"/>

  <!-- mouth (neutral) -->
  <path d="M278 462 Q300 470 322 462" stroke="#3A2E1E" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- subtle stubble -->
  <path d="M236 446 Q300 482 364 446 Q360 470 300 482 Q240 470 236 446 Z" fill="#1A1006" opacity="0.25"/>

  <!-- pen in pocket -->
  <rect x="210" y="640" width="6" height="36" fill="#C58A2C"/>
  <rect x="216" y="640" width="2" height="36" fill="#1A1006"/>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="599" height="749" fill="none" stroke="#F5F1E8" stroke-width="0.6" opacity="0.12"/>
  <rect width="600" height="750" filter="url(#mgrain)" opacity="0.55"/>
</svg>
